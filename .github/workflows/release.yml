name: Release

# Every push to prod (merging main into it) is a release. The version is picked automatically
# (tools/next_version.sh): the patch number goes up, or the minor / major number when a commit
# message since the last release says [minor] / [major]. The workflow tests, tags, packages every
# module into one zip with the version stamped into each TOC, and publishes a GitHub release with
# the ttpz image tool for Windows and Linux attached. Standalone modules (Puzzle) also get a zip of
# their own on the release.
#
# CurseForge needs a CF_API_KEY secret. Each standalone module uploads to its own project once a
# CURSEFORGE_PROJECT_ID_<MODULE> variable (e.g. CURSEFORGE_PROJECT_ID_PUZZLE) is set; the suite zip
# only uploads if CURSEFORGE_PROJECT_ID is set.
#
# Running it by hand on prod releases prod as it is, optionally as an exact version such as a beta.

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      version:
        description: Exact version (e.g. 0.3.0-beta.1); leave empty to pick it automatically
        required: false

permissions:
  contents: write

concurrency: release

jobs:
  # Only prod releases, and creating the branch doesn't count as a release.
  ttpz:
    if: github.ref == 'refs/heads/prod' && !github.event.created
    uses: ./.github/workflows/ttpz.yml

  release:
    needs: ttpz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, changelog and the Puzzle compatibility tests need the whole history

      - name: Pick the version
        id: version
        env:
          REQUEST: ${{ inputs.version || 'auto' }}
        run: |
          released=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -n "$released" ]; then
            echo "This commit is already released as $released." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          version=$(tools/next_version.sh "$REQUEST")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Test
        run: tests/run_all.sh

      - name: Tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Turkey Tickle UI $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Write the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous=$(git tag --list '[0-9]*' --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$VERSION" | head -n1)
          {
            echo "# Turkey Tickle UI $VERSION"
            echo
            git log --no-merges --format='- %s' ${previous:+"$previous.."}"$VERSION"
          } > CHANGELOG.md
          cat CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"

      # On a branch push the packager skips tagged commits, expecting a separate run for the tag.
      # This run made the tag, so the packager runs as if started by hand.
      - name: Package the suite and publish the GitHub release
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/release.sh" https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh
          GITHUB_EVENT_NAME=workflow_dispatch bash "$RUNNER_TEMP/release.sh" ${CURSEFORGE_PROJECT_ID:+-p "$CURSEFORGE_PROJECT_ID"}

      # Modules with their own CurseForge listing also ship alone: a zip of just that addon goes on
      # the GitHub release, and to CurseForge once CURSEFORGE_PROJECT_ID_<MODULE> is set.
      - name: Package standalone modules
        env:
          STANDALONE_MODULES: Puzzle
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          VARS: ${{ toJSON(vars) }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous=$(git tag --list '[0-9]*' --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$VERSION" | head -n1)
          for module in $STANDALONE_MODULES; do
            folder="TurkeyTickleUI_$module"
            {
              echo "# Turkey Tickle UI: $module $VERSION"
              echo
              git log --no-merges --format='- %s' ${previous:+"$previous.."}"$VERSION" -- "$folder"
            } > CHANGELOG.md
            project=$(jq -r --arg key "CURSEFORGE_PROJECT_ID_${module^^}" '.[$key] // empty' <<< "$VARS")
            GITHUB_EVENT_NAME=workflow_dispatch tools/package_module.sh "$RUNNER_TEMP/release.sh" "$module" ${project:+-p "$project"}
            gh release upload "$VERSION" ".release/standalone/$module/$folder-"*.zip --clobber
          done

      - uses: actions/download-artifact@v8
        with:
          pattern: ttpz-*
          path: ttpz
          merge-multiple: true

      - name: Attach ttpz to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "$VERSION" ttpz/* --clobber
